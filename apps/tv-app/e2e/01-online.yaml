# Main flow on an Android TV emulator: login to the fake panel, library grouped on the device, details, playback + D-pad,
# drawer, download.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "login-server"
    timeout: 90000
- tapOn:
    id: "login-server"
# The emulator reaches the runner's localhost at 10.0.2.2, where the fake panel runs.
- inputText: "http://10.0.2.2:8091"
# Enter moves to the next field (and opens the keyboard there); on the password it signs in.
- pressKey: Enter
- inputText: "demo"
- pressKey: Enter
- inputText: "demo"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 60000
- takeScreenshot: 00-home-initial
# Nav row: Up reaches it; Right walks brand → links → search box → avatar and stays there (never drops into the page).
- repeat:
    times: 4
    commands:
      - pressKey: Remote Dpad Up
- repeat:
    times: 12
    commands:
      - pressKey: Remote Dpad Right
- assertVisible:
    id: "nav-account"
    focused: true
- takeScreenshot: 00-nav-focus
# Movie rows sit below the fold at 960x540 dp; rows reload once the worker finishes grouping titles.
# Rows appear only after the library is grouped, and a scroll that reached the bottom first would never look again:
# back to the top, wait for the "Organizing your library" banner to go, then scroll down; up to three tries.
- retry:
    maxRetries: 2
    commands:
      - scrollUntilVisible:
          element:
            id: "hero-play"
          direction: UP
          timeout: 20000
          optional: true
      - extendedWaitUntil:
          notVisible: "Organizing your library.*"
          timeout: 60000
      - scrollUntilVisible:
          element:
            id: "card-Big Test Movie"
          direction: DOWN
          timeout: 120000
          centerElement: true
- takeScreenshot: 01-home
# Details: three listings grouped into one title with a version picker.
- tapOn:
    id: "card-Big Test Movie"
    index: 0
- extendedWaitUntil:
    visible:
      id: "details-play"
    timeout: 30000
# The version picker sits below the fold of the details panel at 540 dp.
- scrollUntilVisible:
    element: "4K · ENG \\(best\\)"
    direction: DOWN
    timeout: 20000
- takeScreenshot: 02-details
# Play has TV preferred focus: the D-pad centre key starts playback.
- pressKey: Remote Dpad Center
- extendedWaitUntil:
    visible:
      id: "player-screen"
    timeout: 30000
# Let it play, then pause: paused controls stay on screen, so slow screen reads on the emulator cannot miss the clock.
- extendedWaitUntil:
    visible: "__wait_6s__"
    timeout: 6000
    optional: true
- pressKey: Remote Dpad Center
# Paused: the play/pause button (web-style controls) reads "Play"; the clock stays put.
- extendedWaitUntil:
    visible:
      id: "player-toggle"
      text: "Play"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "player-time"
      text: "0:(0[2-9]|[12][0-9]) / 0:30"
    timeout: 30000
- takeScreenshot: 03-player
- copyTextFrom:
    id: "player-time"
- evalScript: ${output.before = Number(maestro.copiedText.split(' / ')[0].split(':')[1])}
# Tap right: +10 s (still paused).
- pressKey: Remote Dpad Right
- extendedWaitUntil:
    visible:
      id: "player-time"
      text: "0:[1-3][0-9] / 0:30.*"
    timeout: 15000
- copyTextFrom:
    id: "player-time"
- evalScript: ${output.after = Number(maestro.copiedText.split(' / ')[0].split(':')[1])}
# Slow screen reads can land the pause late in the 30 s clip: a skip near the end stops at 0:30.
- assertTrue: ${output.after >= Math.min(output.before + 9, 30)}
# Up: quick drawer (audio / subtitles / versions). Back closes it.
- pressKey: Remote Dpad Up
- assertVisible:
    id: "quick-drawer"
- takeScreenshot: 04-drawer
- pressKey: back
- assertNotVisible:
    id: "quick-drawer"
# Down: the focus goes to the on-screen buttons, play/pause first; Right moves along them, Up reaches Back at the top
# left. Back returns to the video, a second Back leaves the player (D-075).
- pressKey: Remote Dpad Down
- extendedWaitUntil:
    visible:
      id: "player-toggle"
      focused: true
    timeout: 10000
- pressKey: Remote Dpad Right
- assertNotVisible:
    id: "player-toggle"
    focused: true
- pressKey: Remote Dpad Up
- assertVisible:
    id: "player-back"
    focused: true
- takeScreenshot: 04b-player-buttons
- pressKey: back
- assertVisible:
    id: "player-screen"
- pressKey: back
- extendedWaitUntil:
    visible:
      id: "details-screen"
    timeout: 15000
# The D-pad stays in the details panel: Down past the last control never reaches the page behind it (D-075).
- repeat:
    times: 8
    commands:
      - pressKey: Remote Dpad Down
- assertVisible:
    id: "details-screen"
- assertNotVisible:
    id: "card-Big Test Movie"
    focused: true
- takeScreenshot: 04c-details-focus-contained
# Download for offline (Media3 DownloadManager, app-private storage).
- tapOn:
    id: "download-button"
- extendedWaitUntil:
    visible: "Downloaded: .*"
    timeout: 240000
- pressKey: back
- tapOn:
    id: "nav-downloads"
- assertVisible: "Big Test Movie"
- takeScreenshot: 05-downloads
# Live TV guide: each channel shows what is on now (short EPG from the panel).
- tapOn:
    id: "nav-live"
- extendedWaitUntil:
    visible:
      id: "guide-now-301"
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "guide-now-304"
    direction: DOWN
    timeout: 20000
- takeScreenshot: 05b-guide
- tapOn:
    id: "guide-now-301"
- extendedWaitUntil:
    visible:
      id: "player-screen"
    timeout: 30000
# Up opens the see-through guide over the playing channel (D-058); Back closes it, the second Back the player.
- pressKey: Remote Dpad Up
- extendedWaitUntil:
    visible:
      id: "guide-channel-301"
    timeout: 20000
- takeScreenshot: 05c-live-guide-overlay
- pressKey: back
- assertNotVisible:
    id: "guide-overlay"
- pressKey: back
