# A fresh sign-in to the fake panel (after the offline flow), on-device library, playback, guide. D-088.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "login-server"
    timeout: 90000
- tapOn:
    id: "login-server"
# The emulator reaches the runner's localhost at 10.0.2.2, where the fake panel runs.
- inputText: "http://10.0.2.2:8091"
# Enter moves to the next field (and opens the keyboard there); on the password it signs in.
- pressKey: Enter
- inputText: "demo"
- pressKey: Enter
- inputText: "demo"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 60000
# The library is grouped on the device (TypeScript normalizer): three listings become one title.
# Rows appear only after the library is grouped, and a scroll that reached the bottom first would never look again:
# back to the top, wait for the "Organizing your library" banner to go, then scroll down; up to three tries.
- retry:
    maxRetries: 2
    commands:
      - scrollUntilVisible:
          element:
            id: "hero-play"
          direction: UP
          timeout: 20000
          optional: true
      - extendedWaitUntil:
          notVisible: "Organizing your library.*"
          timeout: 60000
      - scrollUntilVisible:
          element:
            id: "card-Big Test Movie"
          direction: DOWN
          timeout: 90000
          centerElement: true
- takeScreenshot: 20-direct-home
- tapOn:
    id: "card-Big Test Movie"
    index: 0
- extendedWaitUntil:
    visible:
      id: "details-play"
    timeout: 30000
# The version picker sits below the fold of the details panel at 540 dp.
- scrollUntilVisible:
    element: "4K · ENG \\(best\\)"
    direction: DOWN
    timeout: 20000
# Playback straight from the provider (no relay).
- pressKey: Remote Dpad Center
- extendedWaitUntil:
    visible:
      id: "player-screen"
    timeout: 30000
- extendedWaitUntil:
    visible: "__wait_6s__"
    timeout: 6000
    optional: true
- pressKey: Remote Dpad Center
# Paused: the play/pause button (web-style controls) reads "Play"; the clock stays put.
- extendedWaitUntil:
    visible:
      id: "player-toggle"
      text: "Play"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "player-time"
      text: "0:(0[2-9]|[12][0-9]) / 0:30"
    timeout: 30000
- takeScreenshot: 21-direct-player
- pressKey: back
- extendedWaitUntil:
    visible:
      id: "details-screen"
    timeout: 15000
- pressKey: back
# Guide from the provider's short EPG, including the channel without an XMLTV id.
# Three-column layout: first channel auto-selected, its EPG in right column.
# CI Android TV emulator can be slow; allow up to 90s for the guide to appear (was 60s).
# Retry once in case navigation or initial load is flaky.
- retry:
    maxRetries: 1
    commands:
      - tapOn:
          id: "nav-live"
      - extendedWaitUntil:
          visible:
            id: "live-categories"
          timeout: 90000
      - extendedWaitUntil:
          visible:
            id: "live-channels"
          timeout: 20000
      - extendedWaitUntil:
          visible:
            id: "video-epg-column"
          timeout: 20000
      - extendedWaitUntil:
          visible:
            id: "epg-schedule"
          timeout: 45000
- takeScreenshot: 22-direct-guide
# Account menu → Profiles → Categories shown: the category list fills the tall dialog. Build 231 showed only the
# section chips and Save/Cancel there (issue #330, DECISIONS.md#d-094). Straight from Live TV: Back there leaves the app.
- tapOn:
    id: "nav-account"
- tapOn:
    id: "menu-group-profiles"
- tapOn:
    id: "menu-hidden-categories"
- extendedWaitUntil:
    visible:
      id: "hidden-categories-all"
    timeout: 30000
- assertVisible:
    id: "hidden-category-Action"
- assertVisible:
    id: "hidden-category-Drama"
- takeScreenshot: 23-categories-shown
- tapOn:
    id: "hidden-section-live"
- extendedWaitUntil:
    visible:
      id: "hidden-categories-all"
    timeout: 30000
- assertVisible:
    id: "hidden-category-News"
- takeScreenshot: 24-categories-shown-live
- pressKey: back
