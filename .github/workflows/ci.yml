name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, unit tests, builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: JS workspaces (typecheck, test, build)
        run: npm run typecheck && npm run test && npm run build
      - name: Backend
        run: dotnet test backend/Backend.sln
      - name: API contract is committed
        run: npm run generate:api --workspace=@iptv/shared && git diff --exit-code -- packages/shared
      - name: Title normalizer
        working-directory: services/title-normalizer
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements-dev.txt
          .venv/bin/python -m pytest -q
