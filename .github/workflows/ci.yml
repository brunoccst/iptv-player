name: CI

# Branch pushes are covered by their pull request; running on both doubled every PR check.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Changes to Markdown files and LICENSE only skip the build and e2e jobs; `lint` still checks their formatting.
  # Skipped jobs count as passed for pull requests. Manual runs always build everything.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE" HEAD
          if git diff --name-only "$BASE" HEAD | grep -qvE '(\.md$|^LICENSE$)'; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code changed: $code" >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Typecheck, unit tests, builds
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: JS workspaces (typecheck, test, build)
        run: npm run typecheck && npm run test && npm run build

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: ESLint + Prettier
        run: npm run lint:js
      # Every app has each feature, or the backlog says when it will (documentation/PARITY.md, D-080).
      - name: App parity table
        run: npm run lint:parity
      # Every feature has its technical explanation (documentation/FEATURES-TECHNICAL.md, D-163).
      - name: Technical features
        run: npm run lint:features
      # Every app's version has release notes (documentation/RELEASE-NOTES.md, D-143).
      - name: Release notes
        run: npm run lint:release-notes
      # Every text of the app is translated into each language (packages/shared/src/i18n, D-084).
      - name: Translations
        run: npm run lint:i18n
      - name: Ruff
        run: |
          pip install -q "ruff>=0.6,<1"
          npm run lint:py

  web-e2e:
    name: Web end-to-end (Playwright)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Test media
        run: |
          pip install -q imageio-ffmpeg
          FFMPEG=$(python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())") python tools/fake-xtream-server/generate_media.py
      - name: Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: apps/web-player
      - name: Playwright
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-e2e-results
          path: apps/web-player/test-results

  desktop:
    name: Desktop app (unit tests, start against the fake panel)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Web player build
        run: npx turbo run build --filter=@iptv/web-player
      - name: Desktop dependencies and unit tests
        working-directory: apps/desktop
        run: npm ci && npm test && node scripts/prepare.mjs
      - name: Test media
        run: |
          pip install -q imageio-ffmpeg
          FFMPEG=$(python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())") python tools/fake-xtream-server/generate_media.py
      # Sign-in to the panel, a movie that plays, sign-in kept after a restart (D-071).
      - name: Start the app against the fake panel
        run: |
          (cd tools/fake-xtream-server && python server.py > "$RUNNER_TEMP/panel.log" 2>&1 &)
          sleep 2
          cd apps/desktop && xvfb-run -a node e2e/smoke.mjs
