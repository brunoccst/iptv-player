name: CI

# Branch pushes are covered by their pull request; running on both doubled every PR check.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Changes to Markdown files and LICENSE only skip the build and e2e jobs; `lint` still checks their formatting.
  # Skipped jobs count as passed for pull requests. Manual runs always build everything.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE" HEAD
          if git diff --name-only "$BASE" HEAD | grep -qvE '(\.md$|^LICENSE$)'; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code changed: $code" >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Typecheck, unit tests, builds
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: JS workspaces (typecheck, test, build)
        run: npm run typecheck && npm run test && npm run build
      - name: Backend
        run: dotnet test backend/Backend.sln
      - name: API contract is committed
        run: npm run generate:api --workspace=@iptv/shared && git diff --exit-code -- packages/shared
      - name: Title normalizer
        working-directory: services/title-normalizer
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements-dev.txt
          .venv/bin/python -m pytest -q

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: ESLint + Prettier
        run: npm run lint:js
      - name: dotnet format
        run: npm run lint:backend
      - name: Ruff
        run: |
          pip install -q "ruff>=0.6,<1"
          npm run lint:py

  web-e2e:
    name: Web end-to-end (Playwright)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Worker venv + test media
        run: |
          python -m venv services/title-normalizer/.venv
          services/title-normalizer/.venv/bin/pip install -q -r services/title-normalizer/requirements.txt imageio-ffmpeg
          FFMPEG=$(services/title-normalizer/.venv/bin/python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())") \
            python tools/fake-xtream-server/generate_media.py
      - name: Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: apps/web-player
      - name: Playwright
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-e2e-results
          path: apps/web-player/test-results
