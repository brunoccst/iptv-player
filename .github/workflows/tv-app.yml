name: TV app (Android TV emulator)

on:
  push:
    paths:
      - 'apps/tv-app/**'
      - 'packages/shared/**'
      - 'packages/screens/**'
      - 'tools/fake-xtream-server/**'
      - 'scripts/start-e2e-stack.sh'
      - 'scripts/stop-e2e-stack.sh'
      - 'scripts/create-signing-key.sh'
      - 'package-lock.json'
      - '.github/workflows/tv-app.yml'
      - '.github/actions/test-media/**'
      # READMEs and unit tests do not need an APK build: unit tests run in ci.yml (DECISIONS.md#d-250).
      - '!**/*.md'
      - '!**/*.test.ts'
      - '!**/*.test.tsx'
      - '!**/*.test.mjs'
  workflow_dispatch:

concurrency:
  group: tv-app-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ID: com.iptvplayer.tv
  # Logs every remote event to logcat so failed flows show which keys reached the app.
  APP_TV_DEBUG_REMOTE: '1'
  E2E_RUN_DIR: /tmp/iptv-e2e

jobs:
  # The APK is built once, then three emulators run their share of the flows side by side (DECISIONS.md#d-250).
  # The TV unit tests run in ci.yml's `checks` job.
  build:
    name: Build the x86 release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Caches Gradle's downloads and build cache between runs (written by main; D-030).
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Prebuild Android project
        working-directory: apps/tv-app
        run: CI=1 npx expo prebuild --platform android --no-install

      # Signs with a throwaway key so the release-signing setup (D-052) is exercised on every change.
      - name: Throwaway signing key
        run: |
          bash scripts/create-signing-key.sh --no-upload > /dev/null
          echo "ANDROID_KEYSTORE_FILE=$PWD/.signing/iptv-player-release.p12" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$(cat .signing/ANDROID_KEYSTORE_PASSWORD.txt)" >> "$GITHUB_ENV"

      # Only the emulator's ABI: native code compiles once instead of three times. The ARM APK for real TVs is tv-apk.yml.
      - name: Build release APK
        working-directory: apps/tv-app/android
        run: ./gradlew assembleRelease --no-daemon --build-cache -PreactNativeArchitectures=x86

      - uses: actions/upload-artifact@v4
        with:
          name: tv-app-apk
          path: apps/tv-app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

  maestro:
    name: Maestro, ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android TV (main flow, offline, fresh sign-in)
            flows: tv-1
            api-level: 33
            target: android-tv
            profile: tv_1080p
          - name: Android TV (holding Right)
            flows: tv-2
            api-level: 33
            target: android-tv
            profile: tv_1080p
          # The same APK on a phone: touch and the on-screen keyboard (search box focus, D-069).
          - name: phone (search box)
            flows: phone
            api-level: 30
            target: google_apis
            profile: pixel_4
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Maestro runs on Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/download-artifact@v4
        with:
          name: tv-app-apk
          path: ${{ runner.temp }}/apk

      # The fake panel (Python standard library) and its test videos.
      - uses: ./.github/actions/test-media
        with:
          codec: h264
      - name: Start the fake panel
        run: scripts/start-e2e-stack.sh

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run the Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86
          profile: ${{ matrix.profile }}
          cores: 4
          disable-animations: true
          # No -noaudio: ExoPlayer's clock follows audio output; without a sound device playback stays at 0:00.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: |
            apps/tv-app/e2e/install.sh ${{ runner.temp }}/apk/app-release.apk
            apps/tv-app/e2e/run.sh maestro-output ${{ matrix.flows }}

      - name: Fake panel log
        if: always()
        run: tail -n 80 $E2E_RUN_DIR/panel.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-output-${{ matrix.flows }}
          path: maestro-output
