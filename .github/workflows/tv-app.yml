name: TV app (Android TV emulator)

on:
  push:
    paths:
      - 'apps/tv-app/**'
      - 'packages/shared/**'
      - 'backend/**'
      - 'services/**'
      - 'tools/**'
      - 'scripts/**'
      - 'package-lock.json'
      - '.github/workflows/tv-app.yml'
      # READMEs inside those folders do not need an APK build.
      - '!**/*.md'
  workflow_dispatch:

concurrency:
  group: tv-app-${{ github.ref }}
  cancel-in-progress: true

env:
  # Prefills "My server" (the app still starts in direct mode, D-038), so the server-mode flow does not type it:
  # long inputText on the busy emulator made Maestro's driver die (DeviceServerDiedException). 10.0.2.2 = runner.
  APP_API_BASE_URL: 'http://10.0.2.2:5091'
  APP_ID: com.iptvplayer.tv
  # Logs every remote event to logcat so failed flows show which keys reached the app.
  APP_TV_DEBUG_REMOTE: '1'
  E2E_RUN_DIR: /tmp/iptv-e2e

jobs:
  android-tv:
    name: Build APK + Maestro on Android TV emulator
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # The runner disk is too small for the Gradle build plus the TV system image. See DECISIONS.md#d-030.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/swift /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/local/julia* /opt/microsoft/msedge
          sudo docker image prune --all --force > /dev/null
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Caches Gradle's downloads and build cache between runs (written by main; D-044).
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false # TEMP: measurement on this branch
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: npm ci

      - name: TV unit tests
        run: npm run typecheck --workspace=@iptv/tv-app && npm run test --workspace=@iptv/tv-app

      - name: Prebuild Android project
        working-directory: apps/tv-app
        run: CI=1 npx expo prebuild --platform android --no-install

      # Signs with a throwaway key so the release-signing setup (D-052) is exercised on every change.
      - name: Throwaway signing key
        run: |
          bash scripts/create-signing-key.sh --no-upload > /dev/null
          echo "ANDROID_KEYSTORE_FILE=$PWD/.signing/iptv-player-release.p12" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$(cat .signing/ANDROID_KEYSTORE_PASSWORD.txt)" >> "$GITHUB_ENV"

      # Only the emulator's ABI: native code compiles once instead of three times. The ARM APK for real TVs is tv-apk.yml.
      - name: Build release APK
        working-directory: apps/tv-app/android
        run: ./gradlew assembleRelease --no-daemon --build-cache -PreactNativeArchitectures=x86

      - name: Keep APK, drop build output
        run: |
          cp apps/tv-app/android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/app-release.apk"
          # ~/.gradle/caches stays: the Gradle action saves it at the end of the job for the next run.
          rm -rf apps/tv-app/android/app/build apps/tv-app/android/.gradle
          du -sh ~/.gradle/caches || true
          find node_modules apps/tv-app/modules -path '*/android/build' -type d -prune -exec rm -rf {} +
          df -h /

      - uses: actions/upload-artifact@v4
        with:
          name: tv-app-apk
          path: ${{ runner.temp }}/app-release.apk

      - name: Start local stack (fake panel, backend, worker)
        run: |
          python -m venv services/title-normalizer/.venv
          services/title-normalizer/.venv/bin/pip install -q -r services/title-normalizer/requirements.txt imageio-ffmpeg
          FFMPEG=$(services/title-normalizer/.venv/bin/python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())") \
            python tools/fake-xtream-server/generate_media.py --codec h264
          scripts/start-e2e-stack.sh

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro flows on Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: android-tv
          arch: x86
          profile: tv_1080p
          cores: 4
          disable-animations: true
          # No -noaudio: ExoPlayer's clock follows audio output; without a sound device playback stays at 0:00.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: |
            apps/tv-app/e2e/install.sh ${{ runner.temp }}/app-release.apk
            apps/tv-app/e2e/run.sh maestro-output

      - name: Stack logs
        if: always()
        run: tail -n 80 $E2E_RUN_DIR/*.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-output
          path: maestro-output
