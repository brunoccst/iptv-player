name: TV APK for a real TV

# Builds the TV app for real (ARM) TVs and phones. The APK goes to the `tv-apk` prerelease. See DECISIONS.md#d-037.
# Runs by itself after app changes reach `main` (no "My server" prefill), or by hand with the inputs below.
# The app talks to the IPTV provider directly (D-038); `api_base_url` only prefills "My server".
on:
  push:
    branches: [main]
    paths:
      - 'apps/tv-app/**'
      - 'packages/shared/**'
      - 'package-lock.json'
      - '.github/workflows/tv-apk.yml'
      # Docs and the emulator flows do not change the APK.
      - '!**/*.md'
      - '!apps/tv-app/e2e/**'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Optional: prefill for "My server", e.g. http://192.168.1.10:5080'
        required: false
        default: ''
      publish:
        description: 'Publish to the tv-apk prerelease (off: size report + workflow artifact only)'
        type: boolean
        default: true
      ffmpeg_audio:
        description: 'Bundle the FFmpeg audio decoders (Dolby Digital/Plus, DTS; D-059)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: tv-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_API_BASE_URL: ${{ inputs.api_base_url }}
      # Each build counts as a newer version, so Android installs it over the previous one (D-052).
      APP_ANDROID_VERSION_CODE: ${{ github.run_number }}
      # Pushes always publish; manual runs follow the `publish` input.
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
      # Read by modules/tv-media/android/build.gradle; pushes always bundle it (D-059).
      IPTV_FFMPEG_AUDIO: ${{ github.event_name == 'push' || inputs.ffmpeg_audio }}
    steps:
      - name: Check address
        run: |
          if [ -n "$APP_API_BASE_URL" ] && ! [[ "$APP_API_BASE_URL" =~ ^https?://[^[:space:]/]+/?$ ]]; then
            echo "::error::api_base_url must be empty or like http://192.168.1.10:5080 (no path)"; exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Prebuild Android project
        working-directory: apps/tv-app
        run: CI=1 npx expo prebuild --platform android --no-install

      # Repo secrets from scripts/create-signing-key.sh (D-052). Without them the APK is debug-signed.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64/ANDROID_KEYSTORE_PASSWORD secrets: the APK is debug-signed and will not install over a release-signed one."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      # Real TVs are ARM; x86 is only for the emulator.
      - name: Build release APK
        working-directory: apps/tv-app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Signature
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          {
            echo "### Signature"
            echo '```'
            "$apksigner" verify --print-certs apps/tv-app/android/app/build/outputs/apk/release/app-release.apk | grep -E 'Signer #1 certificate (DN|SHA-256)'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: APK size report
        run: python3 scripts/apk-size-report.py apps/tv-app/android/app/build/outputs/apk/release/app-release.apk | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: env.PUBLISH != 'true'
        with:
          name: tv-apk
          path: apps/tv-app/android/app/build/outputs/apk/release/app-release.apk

      - name: Publish to the tv-apk prerelease
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apps/tv-app/android/app/build/outputs/apk/release/app-release.apk tv.apk
          signed="$([ -n "${ANDROID_KEYSTORE_FILE:-}" ] && echo 'release key' || echo 'debug key (no signing secrets)')"
          notes="Built from ${GITHUB_SHA::7} (${GITHUB_EVENT_NAME}), version ${APP_ANDROID_VERSION_CODE}, signed with the ${signed}, FFmpeg audio: ${IPTV_FFMPEG_AUDIO}. My server prefill: ${APP_API_BASE_URL:-none}"
          gh release view tv-apk > /dev/null 2>&1 || gh release create tv-apk --prerelease --title "TV APK" --notes "$notes" --target "$GITHUB_SHA"
          gh release edit tv-apk --notes "$notes"
          gh release upload tv-apk tv.apk --clobber
